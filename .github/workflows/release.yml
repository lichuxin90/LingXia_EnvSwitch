# 打 tag（形如 v0.1.0）就会跑这条流水线：三个平台各出一份安装包，按官网下载页承诺的文件名改名，
# 再把 CHANGELOG.md 里对应版本的那一段贴进 GitHub Release 正文。
# 也可以在仓库的 Actions 页手动运行，手动运行时填要发布的标签名。
#
# 安装包里的 envswitch-shim 由 scripts/stage-shim.mjs 先编出来再交给 tauri 打包，
# 少了它，界面装得上但终端里的 node/python/go 起不来。

name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: 要发布的标签（v 开头，例：v0.1.0）
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: 校验版本号并检查前端
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: 标签必须和 tauri.conf.json 里的 version 对上
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          tag="${INPUT_TAG:-$GITHUB_REF_NAME}"
          if [ "$tag" != "v$version" ]; then
            echo "标签 $tag 与 src-tauri/tauri.conf.json 里的版本 $version 不一致；先改版本号，再打标签。" >&2
            exit 1
          fi
          if ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "CHANGELOG.md 里没有 $version 这一节，Release 正文会是空的。" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
        with:
          # 本地开发用的是 pnpm 8，lockfileVersion 6.0 也是它的格式；换大版本会重写锁文件。
          version: 8

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  build:
    name: 打包 ${{ matrix.name }}
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            id: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: msi
          - name: macOS Apple 芯片
            id: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
          - name: macOS Intel
            id: macos-x64
            os: macos-latest
            target: x86_64-apple-darwin
            bundles: dmg
          - name: Linux x64
            id: linux-x64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      ENVSWITCH_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          # 本地开发用的是 pnpm 8，lockfileVersion 6.0 也是它的格式；换大版本会重写锁文件。
          version: 8

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 装 Linux 的打包依赖
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl wget file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - run: pnpm install --frozen-lockfile

      - name: 出安装包
        run: pnpm tauri build --target "${{ matrix.target }}" --bundles "${{ matrix.bundles }}"

      - name: 核对包里带上了转发用的 envswitch-shim
        shell: bash
        run: |
          set -euo pipefail
          bundle="src-tauri/target/${{ matrix.target }}/release/bundle"
          case "${{ runner.os }}" in
            Windows)
              msi="$(ls "$bundle"/msi/*.msi | head -1)"
              sevenz="$(command -v 7z || echo '/c/Program Files/7-Zip/7z.exe')"
              echo "--- $msi 里与 envswitch 有关的条目 ---"
              "$sevenz" l "$msi" | grep -i envswitch
              # 7z 列出的是 msi 内部的条目名，转发程序在那儿叫 Bin_envswitch_shim.exe（下划线），
              # 只按文件名 envswitch-shim.exe 去找会一条都不命中。
              hits=$("$sevenz" l "$msi" | grep -cE 'envswitch[-_]shim' || true)
              ;;
            macOS)
              # 打完 dmg 后 tauri 会把 bundle/macos 里的 .app 清掉，只剩 dmg；
              # 所以要挂载 dmg 看真发出去的那份，不能去翻已经删掉的中间目录。
              dmg="$(ls "$bundle"/dmg/*.dmg | head -1)"
              echo "--- 挂载 $dmg 检查 .app 内的转发二进制 ---"
              mnt="$(mktemp -d)"
              hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$dmg" > /dev/null
              app="$(find "$mnt" -maxdepth 2 -iname '*.app' | head -1)"
              if [ -z "$app" ]; then
                echo "挂载点里没有 .app："
                ls -l "$mnt"
                hdiutil detach "$mnt" || true
                exit 1
              fi
              echo "包目录：$app"
              find "$app" -iname '*envswitch*shim*' -exec ls -l {} +
              hits=$(find "$app" -iname '*envswitch*shim*' -size +1k | wc -l)
              hdiutil detach "$mnt" > /dev/null
              ;;
            Linux)
              echo "--- AppImage 与 deb 源目录内的转发二进制 ---"
              find "$bundle" -iname 'envswitch-shim*' -exec ls -l {} +
              hits=$(find "$bundle" -iname 'envswitch-shim*' -size +1k | wc -l)
              ;;
          esac
          # 没有命中时 find 会安静地返回 0，所以这里按计数判定，别把"没找到"读成"检查通过"。
          echo "包内体积正常的转发二进制：$hits 个"
          [ "$hits" -ge 1 ]

      - name: 另出一份 Windows 免安装包
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $rel = "src-tauri/target/${{ matrix.target }}/release"
          $stage = "portable/EnvSwitch"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "$rel/envswitch.exe" "$stage/EnvSwitch.exe"
          # 转发程序不再由主构建产出（见 Cargo.toml 里 shim 这个 feature），免安装包里用 stage 好的那份。
          Copy-Item "src-tauri/binaries/envswitch-shim-${{ matrix.target }}.exe" "$stage/envswitch-shim.exe"
          New-Item -ItemType Directory -Force -Path release-dist | Out-Null
          Compress-Archive -Path "$stage/*" -DestinationPath "release-dist/EnvSwitch-$env:VERSION-x64-portable.zip"

      - name: 按下载页承诺的文件名归集产物
        shell: bash
        run: |
          set -euo pipefail
          bundle="src-tauri/target/${{ matrix.target }}/release/bundle"
          # 单独用 release-dist 归集，不复用 dist：dist 是前端构建的输出目录，
          # 打包时里面已经有 index.html、logo.png 和 assets/，
          # 混进安装包一起上传，gh 传资产时撞上目录直接报错。
          mkdir -p release-dist
          case "${{ runner.os }}" in
            Windows)
              mv "$bundle"/msi/*.msi "release-dist/EnvSwitch-$VERSION-x64.msi"
              ;;
            macOS)
              # dmg 在 bundle/dmg 下，不在 bundle/macos（那儿只放 .app，且打完镜像会被清掉）。
              if [ "${{ matrix.target }}" = "aarch64-apple-darwin" ]; then
                mv "$bundle"/dmg/*.dmg "release-dist/EnvSwitch-$VERSION-arm64.dmg"
              else
                mv "$bundle"/dmg/*.dmg "release-dist/EnvSwitch-$VERSION-x64.dmg"
              fi
              ;;
            Linux)
              mv "$bundle"/deb/*.deb "release-dist/envswitch_${VERSION}_amd64.deb"
              mv "$bundle"/appimage/*.AppImage "release-dist/EnvSwitch-$VERSION-x86_64.AppImage"
              ;;
          esac
          chmod +x release-dist/*.AppImage 2>/dev/null || true
          ls -l release-dist

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.id }}
          path: release-dist
          if-no-files-found: error
          retention-days: 30

  publish:
    name: 建 GitHub Release
    needs: [preflight, build]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.preflight.outputs.tag }}
      VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: release-dist
          merge-multiple: true

      - name: 把这一版的更新日志切成 Release 正文
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(release-dist/*)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "一个安装包都没拿到，不发 Release。" >&2
            exit 1
          fi
          {
            sed -n "/^## \[$VERSION\]/,/^---$/p" CHANGELOG.md | sed '$d'
            echo
            echo "## English"
            echo
            sed -n "/^### \[$VERSION\]/,/^---$/p" CHANGELOG.md | sed '$d'
          } > release-notes.md
          echo "--- 正文 ---"
          cat release-notes.md
          ls -l release-dist

      - name: 发布
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 只挑普通文件：gh 碰到目录会直接报 "is a directory"，整条发布就断了。
          mapfile -t assets < <(find release-dist -maxdepth 1 -type f | sort)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "release-dist 里没有文件，不发 Release。" >&2
            exit 1
          fi
          printf '要挂上 Release 的文件：%s\n' "${assets[@]}"

          # 标签已经存在（这条流水线就是它触发的），建 Release 时不要再传 --target：
          # 传了会撞上 GitHub 的 HTTP 500，标签指向哪儿 GitHub 自己清楚。
          publish() {
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" "${assets[@]}" --clobber
              gh release edit "$TAG" --title "灵匣 · EnvSwitch $TAG" --notes-file release-notes.md --draft=false
            else
              gh release create "$TAG" "${assets[@]}" \
                --title "灵匣 · EnvSwitch $TAG" \
                --notes-file release-notes.md
            fi
          }

          # 前面四个平台跑了十几分钟，别让一次服务端抖动全作废；传资产是幂等的，重试不重复堆文件。
          ok=0
          for attempt in 1 2 3; do
            if publish; then
              ok=1
              break
            fi
            echo "第 $attempt 次发布没成功，20 秒后再试。" >&2
            sleep 20
          done
          if [ "$ok" -ne 1 ]; then
            echo "三次都没发出去，上面是 gh 给的报错。" >&2
            exit 1
          fi
          gh release view "$TAG"
